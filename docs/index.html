<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vectoriseur de logos</title>
<meta name="description" content="Transformez un logo PNG ou JPG en SVG vectoriel propre : angles nets, lignes droites, cercles parfaits. Gratuit, dans votre navigateur.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M8 23 16 8l8 15' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='8' r='2.6' fill='%23ff5a36'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --ink: #16161a; --muted: #6b6b75; --line: #e4e2dc;
    --accent: #ff5a36; --accent-ink: #ffffff; --ok: #1f9d55; --err: #d93636;
    --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --checker: repeating-conic-gradient(#e9e7e1 0% 25%, #ffffff 0% 50%) 50% / 16px 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114; --surface: #1a1a1f; --ink: #f2f2f4; --muted: #9a9aa6; --line: #2b2b33;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --checker: repeating-conic-gradient(#26262c 0% 25%, #1c1c21 0% 50%) 50% / 16px 16px;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .logo { width: 36px; height: 36px; flex: none; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* Upload */
  #drop {
    display: grid; place-items: center; text-align: center; gap: 10px;
    padding: 56px 20px; border: 2px dashed var(--line); border-radius: var(--radius);
    background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); }
  #drop.over { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  #drop svg { width: 44px; height: 44px; color: var(--accent); }
  #drop strong { font-size: 18px; }
  #drop span { color: var(--muted); font-size: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 10px 16px; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(.95); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Status */
  #status { display: none; align-items: center; gap: 12px; padding: 16px 18px; margin-top: 16px; }
  #status.show { display: flex; }
  .spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status.error { color: var(--err); }
  #status.error .spinner { display: none; }

  /* Result */
  #result { display: none; margin-top: 20px; }
  #result.show { display: block; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .toolbar .group { display: flex; align-items: center; gap: 8px; }
  .toolbar label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  input[type=color] { width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 5px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 7px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--surface); }
  .spacer { flex: 1; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; }
  .pane { min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--line); }
  .pane h3 { margin: 0; padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  .view { height: 520px; overflow: auto; background: var(--checker); }
  .view .inner { min-width: 100%; min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .view img, .view .svgbox { display: block; max-width: none; }
  .view img { image-rendering: auto; }
  .view .svgbox svg { display: block; width: 100%; height: 100%; }
  .stats { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .stats b { color: var(--ink); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px; border-top: 1px solid var(--line); }

  /* API doc */
  details { margin-top: 28px; }
  summary { cursor: pointer; font-weight: 600; padding: 14px 16px; }
  .doc { padding: 0 16px 16px; font-size: 14px; color: var(--muted); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; color: var(--ink); font-size: 13px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: 13px; }

  @media (max-width: 760px) {
    .wrap { padding: 20px 16px 48px; }
    .panes { grid-template-columns: 1fr; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
    .view { height: 340px; }
    .actions .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 23 16 8l8 15" fill="none" stroke="var(--bg)" stroke-width="3" stroke-linejoin="round"/><circle cx="16" cy="8" r="2.6" fill="#ff5a36"/></svg>
    <div>
      <h1>Vectoriseur de logos</h1>
      <p>PNG / JPG → SVG propre : angles nets, lignes droites, cercles parfaits.</p>
    </div>
  </header>

  <label id="drop" for="file">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <strong>Déposez votre logo ici</strong>
    <span>ou cliquez pour choisir un fichier — vous pouvez aussi coller (Ctrl+V)</span>
    <span>PNG, JPG ou WebP · jusqu'à 8 couleurs</span>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  </label>

  <div id="status" class="card"><div class="spinner"></div><div id="statusText">Vectorisation…</div></div>

  <section id="result" class="card" aria-live="polite">
    <div class="toolbar">
      <div class="group">
        <span style="font-size:14px;color:var(--muted)">Couleurs</span>
        <span id="colors" class="group"></span>
        <label title="Couleur du fond">Fond <input id="bg" type="color"></label>
        <label><input id="transparent" type="checkbox"> Fond transparent</label>
      </div>
      <div class="spacer"></div>
      <div class="group">
        <span style="font-size:14px;color:var(--muted)">Zoom</span>
        <div class="seg" id="zoom">
          <button data-z="fit" class="on">Ajuster</button>
          <button data-z="2">200%</button>
          <button data-z="4">400%</button>
          <button data-z="8">800%</button>
        </div>
      </div>
    </div>
    <div class="panes">
      <div class="pane"><h3>Original</h3><div class="view" id="viewA"><div class="inner"><img id="orig" alt="Image originale"></div></div></div>
      <div class="pane"><h3>SVG vectoriel</h3><div class="view" id="viewB"><div class="inner"><div class="svgbox" id="svgbox"></div></div></div></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button class="btn primary" id="dlSvg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
        Télécharger le SVG
      </button>
      <button class="btn" id="dlPng">Télécharger en PNG (4×)</button>
      <button class="btn" id="again">Nouveau logo</button>
    </div>
  </section>


  <footer>Tout se passe dans votre navigateur : vos images ne sont jamais envoyées sur internet.</footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MAX_SIDE = 3000, MAX_PIXELS = 6_000_000;
  const state = { data: null, name: 'logo', zoom: 'fit', origUrl: null };

  function setStatus(text, kind) {
    const s = $('status');
    s.classList.add('show'); s.classList.toggle('error', kind === 'error');
    $('statusText').textContent = text;
  }
  function clearStatus() { $('status').classList.remove('show', 'error'); }

  // Decode the image to RGBA pixels (downscaled if very large)
  async function decode(file) {
    const img = await createImageBitmap(file);
    let k = Math.min(1, MAX_SIDE / Math.max(img.width, img.height), Math.sqrt(MAX_PIXELS / (img.width * img.height)));
    const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    return { rgba: ctx.getImageData(0, 0, w, h).data, width: w, height: h };
  }

  function runWorker(img, onProgress) {
    return new Promise((resolve, reject) => {
      const worker = new Worker('worker.js');
      worker.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'progress') onProgress(m.msg);
        else { worker.terminate(); m.type === 'done' ? resolve(m.result) : reject(new Error(m.msg)); }
      };
      worker.onerror = (e) => { worker.terminate(); reject(new Error(e.message || 'Erreur pendant la vectorisation.')); };
      worker.postMessage({ rgba: img.rgba.buffer, width: img.width, height: img.height }, [img.rgba.buffer]);
    });
  }

  async function handle(file) {
    if (!file || !file.type.startsWith('image/')) { setStatus('Choisissez une image PNG, JPG ou WebP.', 'error'); return; }
    state.name = (file.name || 'logo').replace(/\.[^.]+$/, '') || 'logo';
    $('result').classList.remove('show');
    const t0 = performance.now();
    let stage = 'Lecture de l’image…';
    const show = () => setStatus(`${stage} ${((performance.now() - t0) / 1000).toFixed(0)} s`);
    show();
    const tick = setInterval(show, 1000);
    try {
      const img = await decode(file);
      if (state.origUrl) URL.revokeObjectURL(state.origUrl);
      state.origUrl = URL.createObjectURL(file);
      stage = 'Vectorisation…'; show();
      const json = await runWorker(img, (msg) => { stage = msg; show(); });
      state.data = json;
      const colors = json.colors || [json.fg];
      $('colors').innerHTML = colors.map((c, i) => `<input type="color" data-layer="${i}" value="${c}" title="Couleur ${i + 1}">`).join('');
      $('bg').value = json.bg; $('transparent').checked = false;
      $('orig').src = state.origUrl;
      render();
      $('stats').innerHTML = `<span><b>${json.width} × ${json.height}</b> px</span><span><b>${(json.colors || [1]).length}</b> couleur${(json.colors || [1]).length > 1 ? 's' : ''}</span><span><b>${json.shapes}</b> formes</span><span><b>${json.arcs}</b> cercles exacts</span><span>calcul <b>${(json.ms / 1000).toFixed(1)} s</b></span>`;
      clearStatus();
      $('result').classList.add('show');
      applyZoom();                       // sizes depend on the now-visible panes
      $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      setStatus(e.message && !/decode|source image/i.test(e.message) ? e.message : 'Impossible de lire cette image. Utilisez un PNG, JPG ou WebP.', 'error');
    } finally { clearInterval(tick); }
  }

  // Build the final SVG string from current colour / background choices
  function currentSvg() {
    const d = state.data; if (!d) return '';
    const doc = new DOMParser().parseFromString(d.svg, 'image/svg+xml');
    const svg = doc.documentElement;
    const inputs = [...$('colors').querySelectorAll('input')];
    svg.querySelectorAll('path').forEach((p, i) => { if (inputs[i]) p.setAttribute('fill', inputs[i].value); });
    const rect = svg.querySelector('rect');
    if ($('transparent').checked) rect.remove(); else rect.setAttribute('fill', $('bg').value);
    return new XMLSerializer().serializeToString(svg);
  }

  function render() {
    const box = $('svgbox');
    box.innerHTML = currentSvg();
    applyZoom();
  }

  function applyZoom() {
    const d = state.data; if (!d) return;
    const views = [$('viewA'), $('viewB')];
    let w, h;
    if (state.zoom === 'fit') {
      const v = views[1];
      const k = Math.min((v.clientWidth - 32) / d.width, (v.clientHeight - 32) / d.height);
      w = d.width * k; h = d.height * k;
    } else { w = d.width * +state.zoom; h = d.height * +state.zoom; }
    for (const el of [$('orig'), $('svgbox')]) { el.style.width = w + 'px'; el.style.height = h + 'px'; }
    $('orig').style.imageRendering = state.zoom === 'fit' ? 'auto' : 'pixelated';
  }

  // Keep both panes scrolled to the same spot when zoomed in
  let syncing = false;
  for (const [a, b] of [['viewA', 'viewB'], ['viewB', 'viewA']]) {
    $(a).addEventListener('scroll', () => {
      if (syncing) return; syncing = true;
      $(b).scrollLeft = $(a).scrollLeft; $(b).scrollTop = $(a).scrollTop;
      requestAnimationFrame(() => (syncing = false));
    });
  }

  $('zoom').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state.zoom = b.dataset.z;
    for (const x of $('zoom').children) x.classList.toggle('on', x === b);
    applyZoom();
    for (const v of [$('viewA'), $('viewB')]) { v.scrollLeft = (v.scrollWidth - v.clientWidth) / 2; v.scrollTop = (v.scrollHeight - v.clientHeight) / 2; }
  });
  for (const id of ['colors', 'bg', 'transparent']) $(id).addEventListener('input', render);
  window.addEventListener('resize', applyZoom);

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $('dlSvg').addEventListener('click', () => {
    const suffix = $('transparent').checked ? '-transparent' : '';
    download(new Blob([currentSvg()], { type: 'image/svg+xml' }), `${state.name}${suffix}.svg`);
  });
  $('dlPng').addEventListener('click', async () => {
    const d = state.data; const k = 4;
    const img = new Image();
    img.src = URL.createObjectURL(new Blob([currentSvg()], { type: 'image/svg+xml' }));
    await img.decode();
    const c = document.createElement('canvas'); c.width = d.width * k; c.height = d.height * k;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    c.toBlob((b) => download(b, `${state.name}@4x.png`), 'image/png');
  });
  $('again').addEventListener('click', () => { $('result').classList.remove('show'); window.scrollTo({ top: 0, behavior: 'smooth' }); $('file').value = ''; $('file').click(); });

  // Input methods: click, drag & drop, paste
  $('file').addEventListener('change', (e) => handle(e.target.files[0]));
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => handle(e.dataTransfer.files[0]));
  window.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (item) handle(item.getAsFile());
  });
})();
</script>
</body>
</html>
